<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 250px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0c3b1e; /* Jamaican green */
        color: #ffe08a;
      }
      .wrap { padding: 16px; }
      h1 {
        font-size: 16px; margin: 0 0 2px; letter-spacing: 1px; font-weight: 800;
        display: flex; align-items: center; gap: 8px; color: #ffd24a;
      }
      h1 img { width: 24px; height: 24px; border-radius: 6px; }
      .tag { font-size: 11px; color: #a7d8b4; margin: 0 0 14px; font-style: italic; }
      .toggle {
        width: 100%; border: 0; border-radius: 12px; padding: 14px;
        font-size: 16px; font-weight: 800; cursor: pointer;
        transition: background 0.15s, transform 0.05s; letter-spacing: 0.5px;
      }
      .toggle:active { transform: scale(0.98); }
      .on  { background: #ffd24a; color: #0c3b1e; }
      .off { background: #14532a; color: #a7d8b4; }
      .row {
        display: flex; align-items: center; gap: 8px; margin-top: 14px; font-size: 13px;
      }
      .row input[type="checkbox"] { width: 16px; height: 16px; accent-color: #ffd24a; }
      .row.disabled { opacity: 0.4; }
      .vol { margin-top: 14px; font-size: 12px; }
      .vol input[type="range"] { width: 100%; accent-color: #ffd24a; }
      .hint { font-size: 11px; color: #a7d8b4; margin-top: 12px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><img src="../assets/icons/icon-48.png" alt="" />SCATERNET</h1>
      <p class="tag">skabidibi doubidou bada boudi booo 🎷</p>

      <button id="toggle" class="toggle off">Turn ON — skat</button>

      <div class="vol" id="volRow">
        🔊 Volume
        <input type="range" id="volume" min="0" max="100" step="1" value="70" />
      </div>

      <label class="row" id="muteRow">
        <input type="checkbox" id="mute" />
        🤫 Mute all sound (visuals only)
      </label>

      <label class="row" id="videoRow">
        <input type="checkbox" id="video" checked />
        🎬 Layer ska over videos
      </label>

      <p class="hint">Flip it on, then reload or browse any page. Click anywhere to start the music. Skat.</p>
    </div>
    <script src="state.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
